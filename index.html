<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدحتِ مصطفیٰ ﷺ - کتاب گھر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Jameel Noori Nastaleeq', 'Urdu Typesetting', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #090d16, #1e3a8a, #0f172a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #d4af37;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            padding: 30px 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .header-banner {
            margin-bottom: 25px;
            border-bottom: 2px dashed rgba(212, 175, 55, 0.4);
            padding-bottom: 20px;
        }

        .book-icon-box {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #d4af37, #996515);
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
            border: 2px solid #fff;
        }

        .book-emoji {
            font-size: 42px;
        }

        h1 {
            font-size: 28px;
            color: #f3e5ab;
            margin-bottom: 8px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }

        .subtitle {
            font-size: 15px;
            color: #cbd5e1;
            font-weight: bold;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-item {
            background: linear-gradient(90deg, #1e293b, #334155);
            border: 1px solid #475569;
            padding: 16px 20px;
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .menu-item:hover {
            background: linear-gradient(90deg, #d4af37, #b8860b);
            color: #0f172a;
            border-color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(212, 175, 55, 0.4);
        }

        .menu-item .icon {
            font-size: 24px;
        }

        .menu-item .text {
            font-size: 19px;
            font-weight: bold;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header / Banner Section -->
        <div class="header-banner">
            <div class="book-icon-box">
                <span class="book-emoji">📖</span>
            </div>
            <h1>مدحتِ مصطفیٰ ﷺ</h1>
            <p class="subtitle">از حافظ محمد شمیم اختر گریڈوی</p>
        </div>

        <!-- Menu Options (Like Holy Quran App) -->
        <div class="menu-list">
            <a href="read.html" class="menu-item">
                <span class="icon">📖</span>
                <span class="text">کتاب پڑھیں (Start Reading)</span>
            </a>
            
            <a href="index.html" class="menu-item">
                <span class="icon">📑</span>
                <span class="text">فہرستِ مضامین (Index)</span>
            </a>

            <a href="#" class="menu-item">
                <span class="icon">ℹ️</span>
                <span class="text">تعارف کتاب (About Book)</span>
            </a>
        </div>

        <!-- Footer Note -->
        <div class="footer-note">
            <p>मोबाइल-फ्रेंडली डिजिटल संस्करण • सर्वाधिकार सुरक्षित</p>
        </div>
    </div>

</body>
</html>

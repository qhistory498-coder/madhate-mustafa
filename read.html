<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>مدحت مصطفیٰ ﷺ - مطالعہ کتاب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Jameel Noori Nastaleeq', 'Urdu Typesetting', Arial, sans-serif;
        }
        body {
            background: #000d16;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }
        .top-bar {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            border: 1px solid #0af37;
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        .top-bar a {
            color: #f3e5ab;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            background: #0f172a;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
        }
        .top-bar h2 {
            font-size: 18px;
            color: #f3e5ab;
        }
        .reader-container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 70vh;
            border: 2px solid #0af37;
            touch-action: pan-x pan-y;
        }
        .reader-container img {
            width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            display: block;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .bottom-nav {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            border: 1px solid #0af37;
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-top: 10px;
        }
        .nav-btn {
            background: linear-gradient(135deg, #0af37, #475569);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-btn:hover {
            background: #f3e5ab;
            transform: scale(1.05);
        }
        .page-indicator {
            font-size: 16px;
            color: #f3e5ab;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <a href="index.html">🏠 ہوم</a>
        <h2>مدحت مصطفیٰ ﷺ</h2>
        <span style="font-size: 14px; color: #94a3b8;">137 / 1</span>
    </div>

    <!-- Book Page View Box -->
    <div class="reader-container" id="readerBox">
        <img id="bookImage" src="" alt="Book Page">
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-btn" onclick="prevPage()">⬅ پچھلا</button>
        <span class="page-indicator" id="pageNumberText">صفحہ 1 / 137</span>
        <button class="nav-btn" onclick="nextPage()">اگلا ➡</button>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 137;
        const imgElement = document.getElementById('bookImage');

        function updatePage(direction = 0) {
            imgElement.style.transform = direction > 0 ? "translateX(-20px)" : direction < 0 ? "translateX(20px)" : "translateX(0)";
            imgElement.style.opacity = "0.3";

            setTimeout(() => {
                let paddedNum = String(currentPage).padStart(4, '0');
                let path1 = "Hafiz Shamim Giridih_page-" + paddedNum + ".jpg";
                let path2 = "Hafiz Shamim Giridih_page-" + paddedNum + ".JPG";

                let testImg = new Image();
                testImg.src = path1;
                testImg.onload = function() {
                    imgElement.src = path1;
                };
                testImg.onerror = function() {
                    imgElement.src = path2;
                };

                document.getElementById('pageNumberText').innerText = "صفحہ " + currentPage + " / " + totalPages;
                
                imgElement.style.transform = "translateX(0)";
                imgElement.style.opacity = "1";
                window.scrollTo(0, 0);
            }, 100);
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                updatePage(1);
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                updatePage(-1);
            }
        }

        // Smart Touch Swipe (Works with single finger swipe anywhere on screen)
        let touchStartX = 0;
        let touchEndX = 0;
        const readerBox = document.getElementById('readerBox');

        readerBox.addEventListener('touchstart', e => {
            // Only trigger swipe if single touch (allows 2-finger zoom)
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
            }
        }, {passive: true});

        readerBox.addEventListener('touchend', e => {
            if (e.changedTouches.length === 1) {
                touchEndX = e.changedTouches[0].clientX;
                handleSwipe();
            }
        }, {passive: true});

        function handleSwipe() {
            let diff = touchEndX - touchStartX;
            let threshold = 50; // Minimum swipe distance

            if (diff < -threshold) {
                // Swipe Left -> Next Page (RTL Layout)
                nextPage();
            } else if (diff > threshold) {
                // Swipe Right -> Previous Page
                prevPage();
            }
        }

        // Load first page on start
        updatePage(0);
    </script>
</body>
</html>
